name: Test and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r app/. _site/
          cp dist/campaign-builder.html _site/campaign-builder.html
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        with:
          path: _site

  deploy:
    # deploys from the repository's default branch only
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
